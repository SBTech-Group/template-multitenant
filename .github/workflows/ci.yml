name: CI

on:
  pull_request:
    branches: [hml, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked secrets
        shell: bash
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)(\.mcp\.json|\.npmrc)$|\.(pem|key|p12|pfx|jks)$' | grep -Ev '(^|/)\.env\.example$' || true)
          private=$(git grep -l -E -e '-----BEGIN [A-Z ]*PRIVATE[ ]KEY-----' || true)  # [ ] impede casar esta propria linha
          if [[ -n "$leaked$private" ]]; then
            echo "::error::Arquivos sensíveis versionados:"
            echo "$leaked"
            echo "$private"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
      - run: npm test

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testes das Edge Functions
        run: deno test --allow-env --no-lock supabase/functions/_shared
