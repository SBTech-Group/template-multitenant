name: Banco de dados (HML)

# Aplica no projeto Supabase de HML (o único de cada sistema) as migrations que chegam em staging,
# pela Management API (a porta 5432 não é usada). Só arquivos NOVOS em supabase/migrations rodam;
# cada um é registrado em supabase_migrations.schema_migrations na mesma transação.
#
# Manual (Actions → Banco de dados (HML) → Run workflow, ref staging):
#   migration  caminho de uma migration a aplicar (ex.: uma antiga que nunca chegou ao banco)
#   query      SQL de diagnóstico em modo somente leitura; o resultado sai no log
#              (repositório privado, mas não selecione dado pessoal sem necessidade)

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration a aplicar (supabase/migrations/<arquivo>.sql)'
        required: false
      query:
        description: 'SQL somente leitura para diagnóstico'
        required: false

concurrency:
  group: database-hml
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      API: https://api.supabase.com/v1/projects/${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar configuração
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado no repositório"; exit 1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::Variável SUPABASE_PROJECT_REF não configurada no repositório"; exit 1; }

      - name: Escolher migrations
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MIGRATION: ${{ inputs.migration }}
        run: |
          if [ "$EVENT" = push ]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || { echo "::error::Commit anterior ($BEFORE) indisponível; aplique pelo Run workflow."; exit 1; }
            git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'supabase/migrations/*.sql' | sort > /tmp/migrations.txt
          elif [ -n "$MIGRATION" ]; then
            case "$MIGRATION" in supabase/migrations/*.sql) ;; *) echo "::error::Use um caminho supabase/migrations/<arquivo>.sql"; exit 1 ;; esac
            [ -f "$MIGRATION" ] || { echo "::error::$MIGRATION não existe em $GITHUB_REF_NAME"; exit 1; }
            echo "$MIGRATION" > /tmp/migrations.txt
          else
            : > /tmp/migrations.txt
          fi
          echo "Migrations a aplicar:"; cat /tmp/migrations.txt

      - name: Aplicar migrations
        run: |
          while read -r f; do
            [ -n "$f" ] || continue
            base=$(basename "$f" .sql)
            [[ "$base" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "::error::Nome inválido: $f"; exit 1; }
            history="do \$hist\$ begin
              if to_regclass('supabase_migrations.schema_migrations') is not null then
                insert into supabase_migrations.schema_migrations(version, name)
                values ('${base%%_*}', '${base#*_}') on conflict do nothing;
              end if;
            end \$hist\$;"
            jq -n --rawfile sql "$f" --arg history "$history" '{query: ($sql + "\n;\n" + $history)}' > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/body.json)
            if [ "$code" -ge 300 ]; then
              echo "::error::$f falhou (HTTP $code): $(head -c 2000 /tmp/out.json)"
              exit 1
            fi
            echo "ok: $f"
          done < /tmp/migrations.txt

      - name: Consulta de diagnóstico
        if: inputs.query != ''
        env:
          QUERY: ${{ inputs.query }}
        run: |
          jq -n --arg q "$QUERY" '{query: $q, read_only: true}' > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          jq . /tmp/out.json 2>/dev/null || cat /tmp/out.json
          [ "$code" -lt 300 ] || { echo "::error::Consulta falhou (HTTP $code)"; exit 1; }
