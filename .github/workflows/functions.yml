name: Deploy Edge Functions (HML)

# O único projeto Supabase de cada sistema é o de homologação (HML).
# Toda mudança em supabase/functions que chega em staging é publicada nele.
# main não publica funções enquanto não existir um projeto Supabase de produção.

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/functions.yml'
  workflow_dispatch:

concurrency:
  group: edge-functions-hml
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verificar configuração
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado no repositório"; exit 1; }
          [ -n "$PROJECT_REF" ] || { echo "::error::Variável SUPABASE_PROJECT_REF não configurada no repositório"; exit 1; }

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.106.0  # versão exata (a action não aceita v2.stable); atualizar de propósito

      - name: Publicar funções
        run: |
          # Funções = pastas com index.ts, exceto _shared e as listadas em supabase/functions/.deploy-ignore
          ignore=supabase/functions/.deploy-ignore
          fns=$(for d in supabase/functions/*/; do
            n=$(basename "$d")
            [[ "$n" == _* ]] && continue
            [ -f "$d/index.ts" ] || continue
            [ -f "$ignore" ] && grep -qx "$n" "$ignore" && continue
            echo "$n"
          done)
          echo "Publicando no projeto $PROJECT_REF:"; echo "$fns"
          supabase functions deploy $fns --project-ref "$PROJECT_REF" --use-api
